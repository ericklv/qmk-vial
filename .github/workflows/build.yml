name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cornev4
            keyboard: crkbd/rev4_1/standard
            keymap_dir: crkbd
            extra: ''
          - name: lily58pro
            keyboard: lily58/r2g
            keymap_dir: lily58
            extra: '-e CONVERT_TO=promicro_rp2040'

    steps:
      - name: Checkout keymaps
        uses: actions/checkout@v4
        with:
          path: keymaps

      - name: Checkout vial-qmk
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: qmk_firmware
          submodules: recursive

      - name: Copy keymap
        run: |
          dest="qmk_firmware/keyboards/${{ matrix.keymap_dir }}/keymaps/${{ matrix.name }}"
          mkdir -p "$dest"
          cp keymaps/${{ matrix.name }}/*.c keymaps/${{ matrix.name }}/*.h \
             keymaps/${{ matrix.name }}/*.mk keymaps/${{ matrix.name }}/*.json "$dest/"

      - name: Compile
        working-directory: qmk_firmware
        run: |
          qmk config user.qmk_home="$GITHUB_WORKSPACE/qmk_firmware"
          qmk compile -kb ${{ matrix.keyboard }} -km ${{ matrix.name }} ${{ matrix.extra }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: qmk_firmware/*.uf2
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.uf2
